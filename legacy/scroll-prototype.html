<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cyato</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  html { scrollbar-width: none; }
  html::-webkit-scrollbar { display: none; }
  body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
  #stage {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(() => {
  "use strict";

  const FRAME_COUNT = 248;
  const FRAME_VERSION = 3; // bump to bust the browser's cached frame files
  const FRAMES = Array.from({ length: FRAME_COUNT }, (_, i) =>
    `frames/frame-${String(i).padStart(3, "0")}.jpg?v=${FRAME_VERSION}`
  );
  const IMAGE_W = 800;
  const IMAGE_H = 450;
  // Frames per pixel of scroll: the sequence plays continuously as you scroll,
  // the way a video scrubs, instead of jumping on discrete scroll notches.
  const SCROLL_PER_FRAME = 25;
  const PRELOAD_WORKERS = 8;

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d", { alpha: false });

  const images = new Array(FRAME_COUNT);
  let vw = 0;
  let vh = 0;
  let drawX = 0;
  let drawY = 0;
  let drawW = 0;
  let drawH = 0;
  let shown = -1;

  function setPageHeight() {
    document.body.style.height =
      window.innerHeight + (FRAME_COUNT - 1) * SCROLL_PER_FRAME + "px";
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    vw = window.innerWidth;
    vh = window.innerHeight;

    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    canvas.style.width = vw + "px";
    canvas.style.height = vh + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";

    // Cover the viewport with the 16:9 frame, cropping the excess.
    const scale = Math.max(vw / IMAGE_W, vh / IMAGE_H);
    drawW = IMAGE_W * scale;
    drawH = IMAGE_H * scale;
    drawX = (vw - drawW) / 2;
    drawY = (vh - drawH) / 2;

    setPageHeight();
    shown = -1;
    paint(true);
  }

  function isReady(i) {
    const img = images[i];
    return !!img && img.complete && img.naturalWidth > 0;
  }

  function nearestReady(i) {
    for (let d = 1; d < FRAME_COUNT; d++) {
      if (i - d >= 0 && isReady(i - d)) return i - d;
      if (i + d < FRAME_COUNT && isReady(i + d)) return i + d;
    }
    return -1;
  }

  function frameForScroll() {
    const maxScroll = Math.max(
      1,
      document.documentElement.scrollHeight - window.innerHeight
    );
    const progress = Math.max(0, Math.min(1, window.scrollY / maxScroll));
    return Math.round(progress * (FRAME_COUNT - 1));
  }

  function drawFrame(index) {
    if (!vw || !vh) return;

    if (!isReady(index)) {
      // While a frame is still decoding, keep showing the closest ready one
      // rather than flashing black.
      const fallback = nearestReady(index);
      if (fallback < 0) return;
      index = fallback;
    }

    ctx.globalAlpha = 1;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, vw, vh);
    ctx.drawImage(images[index], drawX, drawY, drawW, drawH);
  }

  // Continuous playback: every animation frame we look at the current scroll
  // position and show the matching frame, so motion follows the scroll exactly
  // with no easing and no stepping.
  function paint(force) {
    const want = frameForScroll();
    if (!force && want === shown) return;
    if (!isReady(want) && !force) return;
    drawFrame(want);
    shown = isReady(want) ? want : -1;
  }

  function loop() {
    paint(false);
    requestAnimationFrame(loop);
  }

  function preload() {
    const queue = Array.from({ length: FRAME_COUNT }, (_, i) => i);

    const worker = async () => {
      while (queue.length) {
        const i = queue.shift();

        await new Promise((resolve) => {
          const img = new Image();
          img.decoding = "async";

          img.onload = () => {
            images[i] = img;
            if (img.decode) img.decode().catch(() => {});
            paint(true);
            resolve();
          };
          img.onerror = resolve;

          img.src = FRAMES[i];
        });
      }
    };

    for (let n = 0; n < PRELOAD_WORKERS; n++) worker();
  }

  window.addEventListener("resize", resize);
  window.addEventListener("pageshow", resize);

  resize();
  requestAnimationFrame(loop);
  preload();
})();
</script>
</body>
</html>
